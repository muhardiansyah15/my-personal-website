<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <radialGradient id="glow" cx="15%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1ed760" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vinyl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="800" height="470" fill="#0c0e0d"/>
  <rect width="800" height="470" fill="url(#glow)"/>

  <!-- topbar -->
  <rect x="0" y="0" width="800" height="54" fill="#0c0e0dcc"/>
  <line x1="0" y1="54" x2="800" y2="54" stroke="#ffffff14"/>
  <g fill="#1ed760">
    <rect x="28" y="24" width="4" height="12" rx="2"/>
    <rect x="35" y="18" width="4" height="18" rx="2"/>
    <rect x="42" y="21" width="4" height="15" rx="2"/>
    <rect x="49" y="16" width="4" height="20" rx="2"/>
    <rect x="56" y="23" width="4" height="13" rx="2"/>
  </g>
  <text x="72" y="34" fill="#f4f7f4" font-size="17" font-weight="800">Resonance</text>
  <text x="168" y="34" fill="#7d857f" font-size="11">your Spotify stats</text>
  <circle cx="742" cy="27" r="11" fill="none" stroke="#1ed760" stroke-width="2"/>

  <!-- range pills -->
  <g font-size="11">
    <rect x="28" y="70" width="98" height="26" rx="13" fill="#1ed76024" stroke="#1ed760"/>
    <text x="77" y="87" fill="#1ed760" text-anchor="middle" font-weight="600">Last 4 Weeks</text>
    <rect x="134" y="70" width="102" height="26" rx="13" fill="#181c1a" stroke="#ffffff14"/>
    <text x="185" y="87" fill="#b8bfba" text-anchor="middle">Last 6 Months</text>
    <rect x="244" y="70" width="72" height="26" rx="13" fill="#181c1a" stroke="#ffffff14"/>
    <text x="280" y="87" fill="#b8bfba" text-anchor="middle">All Time</text>
  </g>

  <!-- stat tiles -->
  <g>
    <rect x="28" y="110" width="172" height="64" rx="12" fill="#181c1a" stroke="#ffffff14"/>
    <text x="42" y="132" fill="#7d857f" font-size="9" letter-spacing="1.2">TOP ARTIST</text>
    <circle cx="52" cy="152" r="10" fill="#2a3a2f"/>
    <text x="68" y="156" fill="#f4f7f4" font-size="13" font-weight="700">Coldplay</text>

    <rect x="208" y="110" width="172" height="64" rx="12" fill="#181c1a" stroke="#ffffff14"/>
    <text x="222" y="132" fill="#7d857f" font-size="9" letter-spacing="1.2">GENRES EXPLORED</text>
    <text x="222" y="158" fill="#f4f7f4" font-size="20" font-weight="800">27</text>

    <rect x="388" y="110" width="184" height="64" rx="12" fill="#181c1a" stroke="#ffffff14"/>
    <text x="402" y="132" fill="#7d857f" font-size="9" letter-spacing="1.2">MAINSTREAM SCORE</text>
    <text x="402" y="158" fill="#f4f7f4" font-size="20" font-weight="800">68<tspan fill="#7d857f" font-size="11">/100</tspan></text>
    <rect x="462" y="148" width="96" height="6" rx="3" fill="#17a94b2e"/>
    <rect x="462" y="148" width="65" height="6" rx="3" fill="#17a94b"/>
  </g>

  <!-- genre bars card -->
  <rect x="28" y="192" width="420" height="250" rx="14" fill="#181c1a" stroke="#ffffff14"/>
  <text x="48" y="222" fill="#f4f7f4" font-size="14" font-weight="600">Top Genres</text>
  <g font-size="11" fill="#b8bfba">
    <text x="48" y="252">pop</text>
    <rect x="120" y="242" width="270" height="13" rx="3" fill="#17a94b"/>
    <text x="48" y="284">indie rock</text>
    <rect x="120" y="274" width="216" height="13" rx="3" fill="#17a94b"/>
    <text x="48" y="316">jazz</text>
    <rect x="120" y="306" width="168" height="13" rx="3" fill="#17a94b"/>
    <text x="48" y="348">k-pop</text>
    <rect x="120" y="338" width="128" height="13" rx="3" fill="#17a94b"/>
    <text x="48" y="380">lo-fi</text>
    <rect x="120" y="370" width="92" height="13" rx="3" fill="#17a94b"/>
    <text x="48" y="412">classical</text>
    <rect x="120" y="402" width="60" height="13" rx="3" fill="#17a94b"/>
  </g>

  <!-- now playing card with vinyl -->
  <rect x="466" y="192" width="306" height="250" rx="14" fill="#181c1a" stroke="#ffffff14"/>
  <text x="488" y="222" fill="#f4f7f4" font-size="14" font-weight="600">Now Playing</text>
  <g fill="#1ed760">
    <rect x="590" y="212" width="3" height="9" rx="1.5"/>
    <rect x="596" y="209" width="3" height="12" rx="1.5"/>
    <rect x="602" y="214" width="3" height="7" rx="1.5"/>
  </g>
  <circle cx="558" cy="330" r="62" fill="url(#vinyl)"/>
  <circle cx="558" cy="330" r="62" fill="none" stroke="#ffffff1f"/>
  <circle cx="558" cy="330" r="48" fill="none" stroke="#ffffff10"/>
  <circle cx="558" cy="330" r="38" fill="#1db95426"/>
  <circle cx="558" cy="330" r="6" fill="#181c1a" stroke="#ffffff45" stroke-width="2"/>
  <text x="640" y="316" fill="#f4f7f4" font-size="13" font-weight="700">Viva La Vida</text>
  <text x="640" y="336" fill="#7d857f" font-size="11">Coldplay</text>
  <rect x="640" y="352" width="112" height="5" rx="2.5" fill="#202622"/>
  <rect x="640" y="352" width="74" height="5" rx="2.5" fill="#1ed760"/>
</svg>
