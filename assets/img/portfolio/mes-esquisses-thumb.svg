<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- hero bleu -->
  <rect width="800" height="256" fill="#6f8db5"/>
  <g font-family="'Courier New', monospace" font-size="12" fill="#111">
    <text x="26" y="34" font-weight="700">MES·ESQUISSES</text>
    <text x="620" y="34">VISAGES&#160;&#160;LETTRES</text>
  </g>
  <text x="400" y="128" text-anchor="middle" fill="#111111" font-size="64" font-weight="800" letter-spacing="2">MES</text>
  <text x="400" y="196" text-anchor="middle" fill="#111111" font-size="64" font-weight="800" letter-spacing="2">ESQUISSES</text>
  <text x="400" y="232" text-anchor="middle" fill="#111111" font-size="13" opacity="0.75">One face. One name. Redrawn by many hands.</text>

  <!-- badge melingkar -->
  <circle cx="700" cy="196" r="38" fill="none" stroke="#111" stroke-width="1.4" stroke-dasharray="3 4"/>
  <circle cx="700" cy="196" r="20" fill="#111" opacity="0.85"/>
  <path d="M692 200 q4 -10 8 -2 q4 8 8 -4" stroke="#fff" stroke-width="1.4" fill="none"/>

  <!-- marquee noir -->
  <rect y="256" width="800" height="44" fill="#0d0d0d"/>
  <text x="400" y="285" text-anchor="middle" fill="#e8e4d9" font-size="17" font-weight="700" letter-spacing="3">WPAP ✳ SCRATCH ✳ KUFI ✳ VITRAIL ✳ GRAVURE ✳ SCRIBBLE</text>

  <!-- rangée de cartes -->
  <rect y="300" width="800" height="126" fill="#ffffff"/>
  <g>
    <rect x="26"  y="318" width="172" height="90" rx="4" fill="#e88ca0"/>
    <path d="M70 408 l30 -52 26 20 22 -34 24 66 z" fill="#a13b52"/>
    <rect x="212" y="318" width="172" height="90" rx="4" fill="#e8e4d9"/>
    <circle cx="298" cy="363" r="26" fill="none" stroke="#8f7f52" stroke-width="3" stroke-dasharray="2 3"/>
    <rect x="398" y="318" width="172" height="90" rx="4" fill="#111111"/>
    <path d="M448 396 q18 -40 36 -22 q18 18 34 -18" stroke="#fff" stroke-width="1.3" fill="none" opacity="0.8"/>
    <rect x="584" y="318" width="190" height="90" rx="4" fill="#c9bb3f"/>
    <g stroke="#111" stroke-width="6" fill="none">
      <path d="M628 342 h34 v20 h-20 M628 384 h44 M690 342 v42 h30 v-28"/>
    </g>
  </g>

  <!-- bande moutarde -->
  <rect y="426" width="800" height="44" fill="#c9bb3f"/>
  <text x="400" y="454" text-anchor="middle" fill="#111" font-size="14" font-weight="700" letter-spacing="2">EVERY SKETCH HERE IS ONE PERSON</text>
</svg>
