<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Loading">
  <style>
    .mono { font-family: Georgia, 'Times New Roman', serif; fill: #fff; }
    .line { stroke: #fff; stroke-width: 1.4; stroke-linecap: round; }
    .orbit {
      transform-origin: 60px 60px;
      animation: rotate 2.4s linear infinite; /* clockwise */
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .orbit { animation-duration: 8s; }
    }
  </style>

  <!-- everything except the R spins clockwise around the center -->
  <g class="orbit">
    <g class="line" fill="none">
      <line x1="17" y1="17" x2="38.8" y2="38.8"/>
      <line x1="103" y1="17" x2="81.2" y2="38.8"/>
      <line x1="17" y1="103" x2="38.8" y2="81.2"/>
      <line x1="103" y1="103" x2="81.2" y2="81.2"/>
      <circle cx="60" cy="60" r="30"/>
    </g>
    <g class="mono" text-anchor="middle">
      <text x="60" y="21" dy=".35em" font-size="17">H</text>
      <text x="21" y="60" dy=".35em" font-size="17">A</text>
      <text x="99" y="60" dy=".35em" font-size="17">D</text>
      <text x="60" y="99" dy=".35em" font-size="17">I</text>
    </g>
  </g>

  <!-- the R stays still: the axis the logo turns around -->
  <text class="mono" x="60" y="60" dy=".35em" font-size="30" text-anchor="middle">R</text>
</svg>
